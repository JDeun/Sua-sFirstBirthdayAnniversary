name: Scaffold CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests (synthetic files only)
        run: python -m unittest discover -s tests -v
  video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate Remotion composition bundling
        run: npx remotion compositions src/index.ts
      - name: Smoke-render synthetic opening frame
        run: npx remotion still src/index.ts OpeningSequence out/opening-smoke.png --frame=280 --scale=0.25
      - name: Smoke-render synthetic full-film frame
        run: npx remotion still src/index.ts BirthdayFilm out/film-smoke.png --frame=400 --scale=0.25
