name: Scaffold CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests (synthetic files only)
        run: python -m unittest discover -s tests -v
  video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate Remotion composition bundling
        run: npx remotion compositions src/index.ts
      - name: Smoke-render synthetic opening frame
        run: npx remotion still src/index.ts OpeningSequence out/opening-smoke.png --frame=239 --scale=0.25
      - name: Smoke-render synthetic full-film frame
        run: npx remotion still src/index.ts BirthdayFilm out/film-smoke.png --frame=450 --scale=0.25

      - name: Smoke-render transition boundaries as MP4 (synthetic only)
        run: npx remotion render src/index.ts OpeningSequence out/opening-transitions.mp4 --frames=235-465 --scale=0.25 --codec=h264 --concurrency=2

      - name: Generate synthetic birth video and silent story soundtrack
        run: |
          mkdir -p public/media/birth
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac public/media/birth/ci-birth.mp4
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=frequency=330:sample_rate=48000 -t 9 -c:a aac public/media/birth/ci-song.m4a
      - name: Render synthetic birth footage and song boundary
        run: |
          cat > /tmp/ci-opening-props.json <<'EOF'
          {"imagePaths":[],"musicPath":"media/birth/ci-song.m4a","birthClip":{"path":"media/birth/ci-birth.mp4","sourceStartFrame":0,"withAudio":true},"timing":{"matchcutEndFrame":240,"birthEndFrame":360,"songStartFrame":450}}
          EOF
          npx remotion render src/index.ts OpeningSequence out/birth-integration.mp4 --props=/tmp/ci-opening-props.json --frames=235-465 --scale=0.25 --codec=h264 --concurrency=2
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out/birth-integration.mp4 | grep -q audio
