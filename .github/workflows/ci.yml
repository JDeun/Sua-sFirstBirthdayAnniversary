name: Template checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Install local tool dependencies
        run: python -m pip install -r requirements.txt
      - name: Check public boundary and pinned model
        run: |
          python scripts/audit_public.py
          python scripts/setup_models.py
          python -m unittest discover -s tests -v
      - name: Check media algorithms and project preparation
        run: python -B tools/run_tests.py
      - name: Stage synthetic geometry fixture
        run: python -B tools/prepare_project.py --config examples/demo/project.json --copy
      - name: Install locked renderer dependencies
        run: npm ci --prefix renderer
      - name: Check renderer types and preflight
        run: |
          npm run typecheck --prefix renderer
          npm run test:matchcut --prefix renderer
          npm run test:story --prefix renderer
          npm run preflight --prefix renderer
      - name: Render three synthetic frames
        working-directory: renderer
        run: |
          npx remotion browser ensure
          npx remotion render src/index.ts FamilyFilm ../.cache/demo-smoke.mp4 --frames=0-2 --codec=h264
      - name: Render the code-only asset catalog
        working-directory: renderer
        run: npx remotion render src/asset-index.ts AssetCatalog ../.cache/assets-smoke.mp4 --frames=30-32 --codec=h264
      - name: Render across an independent matchcut boundary
        working-directory: renderer
        run: npx remotion render src/matchcut-index.ts FaceMatchcutDemo ../.cache/matchcut-smoke.mp4 --frames=4-6 --codec=h264
